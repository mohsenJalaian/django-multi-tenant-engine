
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-multi-tenant-engine"
version = "0.1.0"
description = "A reusable multi-tenant engine for Django applications"
authors = [
    { name = "Seyed Mohsen Jalalian" },
]
keywords = ["django", "multi-tenant", "multi-tenancy", "tenant"]
classifiers = [
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2",
]
[project.urls]
Homepage = "https://github.com/mohsenJalaian/django-multi-tenant-engine"
Repository = "https://github.com/mohsenJalaian/django-multi-tenant-engine"
Issues = "https://github.com/mohsenJalaian/django-multi-tenant-engine/issues"
[tool.setuptools.packages.find]
include = ["django_multi_tenant*"]
exclude = ["django_multi_tenant.tests*"]
[tool.ruff.lint]
ignore = ["RUF012"]
[tool.ruff.lint.per-file-ignores]
"django_multi_tenant/models.py" = ["I001"]